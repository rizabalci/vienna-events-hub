name: Telegram Check Command

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-check
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Poll for commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOME_ADDRESS: ${{ secrets.HOME_ADDRESS }}
        run: node scripts/telegram-poll.js

      - name: Commit state
        run: |
          git config user.name "telegram-check"
          git config user.email "actions@github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Telegram check: state update"
            git pull --rebase
            git push
          fi
