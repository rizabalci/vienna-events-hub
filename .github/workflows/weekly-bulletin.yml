name: Weekly Vienna Events Bulletin

on:
  schedule:
    # 07:00 UTC every Monday.
    # Vienna is UTC+1 in winter (08:00 local) and UTC+2 in summer (09:00 local).
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      lang:
        description: 'Language for the bulletin'
        required: false
        default: 'en'
        type: choice
        options: [en, de]
      start_date:
        description: 'Override start date (YYYY-MM-DD), for testing'
        required: false
        default: ''
      dry_run:
        description: 'Print the message instead of sending it'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  bulletin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check secrets
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          missing=0
          if [ -z "$TOKEN" ]; then echo "::error::TELEGRAM_BOT_TOKEN is not set (Settings > Secrets and variables > Actions > Repository secrets)"; missing=1; fi
          if [ -z "$CHAT" ];  then echo "::error::TELEGRAM_CHAT_ID is not set (Settings > Secrets and variables > Actions > Repository secrets)"; missing=1; fi
          if [ "$missing" = "1" ]; then exit 1; fi
          echo "Both secrets present."

      - name: Send bulletin
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LANG_MODE: ${{ github.event.inputs.lang || 'en' }}
          START_DATE: ${{ github.event.inputs.start_date || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: node scripts/bulletin.js
